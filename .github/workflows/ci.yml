# On every push and pull request: lines longer than 100 columns (make lint), a build
# with warnings as errors, GCC's static analyzer (make analyze), then make check,
# the whole test suite under AddressSanitizer and UndefinedBehaviorSanitizer and the
# kept fuzz inputs. GitHub has no Ubuntu with wlroots 0.19 yet, so it all runs in
# tests/Containerfile's image, as on a developer's machine. The test logs come out
# of the container and stay with a failed run.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Image
        run: docker build -t mwc-test -f tests/Containerfile tests

      - name: make lint, build with -Werror, make analyze, make check
        run: |
          mkdir -m 777 logs
          docker run --rm --network=none \
            -v "$PWD:/src/mwc:ro" -v "$PWD/logs:/logs" mwc-test sh -c '
              cp -r /src/mwc /tmp/mwc && cd /tmp/mwc && make clean &&
              make lint && make CFLAGS="-O2 -g -Werror" && make analyze &&
              make -k check; status=$?
              cp build/*.log build/*.png /logs/ 2>/dev/null; exit $status'

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
