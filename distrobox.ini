# Development box for mwc (rootless Podman + Distrobox).
#
#   distrobox assemble create --replace --file distrobox.ini
#   distrobox enter mwc-dev
[mwc-dev]
image=docker.io/library/ubuntu:26.04
additional_packages="build-essential pkg-config libwlroots-0.19-dev"
additional_packages="wayland-protocols libwayland-dev libxkbcommon-dev"
additional_packages="libpixman-1-dev libcairo2-dev libpango1.0-dev xwayland"
additional_packages="libxcb1-dev libxcb-icccm4-dev libx11-dev"
additional_packages="xterm foot grim"
# The host's /tmp/.X11-unix shows up in a rootless container with a foreign
# owner. wlroots refuses it, so XWayland would not start without this tmpfs.
additional_flags="--tmpfs /tmp/.X11-unix:mode=1777"
