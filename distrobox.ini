# Development box for mwc (rootless Podman + Distrobox).
#
#   distrobox assemble create --replace --file distrobox.ini
#   distrobox enter mwc-dev
[mwc-dev]
image=docker.io/library/archlinux:latest
additional_packages="base-devel pkgconf wlroots0.20"
additional_packages="wayland wayland-protocols libxkbcommon"
additional_packages="pixman cairo pango"
# valgrind needs glibc's symbols, which Arch ships apart, as tests/Containerfile has.
pre_init_hooks="printf '[core-debug]\\nServer = https://geo.mirror.pkgbuild.com/core-debug/os/x86_64\\n' >>/etc/pacman.conf"
additional_packages="foot grim valgrind glibc-debug"
# A cursor theme whose shapes differ, for tests/pointer.sh, as tests/Containerfile has.
additional_packages="adwaita-icon-theme"
# make fuzz: libFuzzer comes with clang.
additional_packages="clang compiler-rt"
# mwc -v names the commit built.
additional_packages="git"
