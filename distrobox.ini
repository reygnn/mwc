# Development box for mwc (rootless Podman + Distrobox).
#
#   distrobox assemble create --replace --file distrobox.ini
#   distrobox enter mwc-dev
[mwc-dev]
image=docker.io/library/ubuntu:26.04
additional_packages="build-essential pkg-config libwlroots-0.19-dev"
additional_packages="wayland-protocols libwayland-dev libxkbcommon-dev"
additional_packages="libpixman-1-dev libcairo2-dev libpango1.0-dev"
additional_packages="foot grim valgrind"
# make fuzz: libFuzzer comes with clang.
additional_packages="clang libclang-rt-dev"
# mwc -v names the commit built.
additional_packages="git"
